# Minimal Supabase API gateway: routes the two API surfaces the app uses.
# supabase-js calls {SUPABASE_URL}/auth/v1/* (GoTrue) and /rest/v1/* (PostgREST).
#
# CORS is handled here (like Kong does in the official Supabase stack):
# the browser app on localhost:3000 calls this gateway on localhost:54321,
# which is cross-origin. GoTrue does not approve the preflight on its own.

server {
    listen 8000;
    client_max_body_size 20m;

    location = /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location /auth/v1/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Apikey, Content-Type, X-Client-Info, X-Supabase-Api-Version, Prefer, Range, Accept-Profile, Content-Profile";
            add_header Access-Control-Max-Age 86400;
            return 204;
        }
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Expose-Headers "Content-Range, X-Supabase-Api-Version" always;
        proxy_pass http://auth:9999/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /rest/v1/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Apikey, Content-Type, X-Client-Info, X-Supabase-Api-Version, Prefer, Range, Accept-Profile, Content-Profile";
            add_header Access-Control-Max-Age 86400;
            return 204;
        }
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Expose-Headers "Content-Range, X-Supabase-Api-Version" always;
        proxy_pass http://rest:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
