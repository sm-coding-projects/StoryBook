# Self-contained stack: `docker compose up -d --build` from the repo root,
# then open http://localhost:3000 and log in with
#   photographer@demo.com / password123  (or client@demo.com / password123)
#
# Services: Postgres (Supabase image) + GoTrue (auth) + PostgREST (data API)
# + nginx gateway + MinIO (S3) + one-shot migration/bucket/seed jobs
# + the Next.js web app + the image-processing worker.
#
# All secrets below are well-known local demo values — never use in production.

x-demo-keys: &demo-env
  JWT_SECRET: &jwt-secret super-secret-jwt-token-with-at-least-32-characters-long
  ANON_KEY: &anon-key eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
  SERVICE_ROLE_KEY: &service-key eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU

services:
  db:
    image: supabase/postgres:15.8.1.060
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      JWT_SECRET: *jwt-secret
      JWT_EXP: 3600
    ports:
      - "54322:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./infra/docker/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  auth:
    image: supabase/gotrue:v2.170.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://localhost:54321
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:postgres@db:5432/postgres
      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_URI_ALLOW_LIST: http://localhost:3000/auth/callback
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_SECRET: *jwt-secret
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  rest:
    image: postgrest/postgrest:v12.2.3
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:postgres@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: *jwt-secret
      PGRST_DB_USE_LEGACY_GUCS: "false"
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    depends_on:
      - auth
      - rest
    ports:
      - "54321:8000"
    volumes:
      - ./infra/docker/gateway/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- one-shot jobs -------------------------------------------------------

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/gallery-originals local/gallery-derivatives local/gallery-exports &&
      echo '[minio-init] Buckets ready.'"

  db-init:
    image: postgres:15-alpine
    depends_on:
      auth:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./supabase/migrations:/migrations:ro
      - ./infra/docker/db-init/apply.sh:/apply.sh:ro
    entrypoint: ["/bin/sh", "/apply.sh"]

  seed:
    image: node:20-alpine
    depends_on:
      db-init:
        condition: service_completed_successfully
      gateway:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      SUPABASE_URL: http://gateway:8000
      SUPABASE_SERVICE_ROLE_KEY: *service-key
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: gallery-originals
    volumes:
      - ./infra/docker/seed/seed.mjs:/seed.mjs:ro
    command: ["node", "/seed.mjs"]

  # --- apps ----------------------------------------------------------------

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Baked into the browser bundle — must be reachable from the BROWSER.
        NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
        NEXT_PUBLIC_SUPABASE_ANON_KEY: *anon-key
        NEXT_PUBLIC_APP_URL: http://localhost:3000
    depends_on:
      seed:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    environment:
      # Server-side traffic stays on the compose network.
      SUPABASE_URL: http://gateway:8000
      SUPABASE_SERVICE_ROLE_KEY: *service-key
      # Presigned URLs are fetched by the browser — endpoint must be host-reachable.
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: gallery-originals
      S3_DERIVATIVES_BUCKET: gallery-derivatives
      S3_EXPORTS_BUCKET: gallery-exports
      S3_FORCE_PATH_STYLE: "true"
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-noreply@storybook.systems}
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/postgres
      SUPABASE_URL: http://gateway:8000
      SUPABASE_SERVICE_ROLE_KEY: *service-key
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: gallery-originals
      S3_DERIVATIVES_BUCKET: gallery-derivatives
      S3_EXPORTS_BUCKET: gallery-exports
      S3_FORCE_PATH_STYLE: "true"
      NODE_ENV: production
    restart: unless-stopped

volumes:
  db-data:
  minio-data:
